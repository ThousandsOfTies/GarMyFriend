<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GarMyFriend</title>
  <link rel="stylesheet" href="/simulator/style.css">
  <script type="module" src="/simulator/app.js"></script>
</head>
<body>
  <main>
    <section class="part display-part" aria-labelledby="display-title">
      <h2 id="display-title">顔のディスプレイ</h2>
      <div class="display-module">
        <div class="bezel"><gar-display id="screen" width="240" height="240" label="GC9A01の画面"></gar-display></div>
        <div class="pins" aria-hidden="true"><span>VCC</span><span>GND</span><span>SCL</span><span>SDA</span><span>DC</span><span>CS</span><span>RST</span></div>
      </div>
      <p class="part-label">GC9A01 · 240 × 240</p>
    </section>
    <section class="part rotary-part" aria-labelledby="rotary-title">
      <h2 id="rotary-title">ノブで表情を変える</h2>
      <gar-rotary id="rotary" label="KY-040 · ROTARY ENCODER" disabled></gar-rotary>
    </section>
    <p id="status" role="status">部品との接続を確認中</p>
  </main>
</body>
</html>
